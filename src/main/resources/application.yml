spring:
  application:
    name: agrocontrol

  data:
    web:
      pageable:
        # Teto de seguranca: impede requisicoes como ?size=100000 (default do Spring e 2000).
        max-page-size: 100
        default-page-size: 20

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:agrocontrol}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. 'validate' garante que entidades batem com o banco,
      # mas nunca altera DDL em runtime (antipadrao em producao).
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# Configuracao da aplicacao (lida por JwtProperties)
agrocontrol:
  cors:
    # Origens permitidas para o frontend (ex.: Angular). Separe por virgula em producao.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  security:
    jwt:
      # Em producao, injete via variavel de ambiente. Minimo 256 bits (32 chars) para HS256.
      secret: ${JWT_SECRET:change-me-in-production-this-secret-must-be-at-least-32-bytes-long}
      expiration-ms: ${JWT_EXPIRATION_MS:3600000} # 1 hora

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        # NUNCA use "*": exporia env, heapdump, mappings etc. Exponha so o necessario.
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    dev.willian.agrocontrol: INFO
    org.flywaydb: INFO
