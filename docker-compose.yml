services:
  db:
    image: postgres:16-alpine
    container_name: agrocontrol-db
    environment:
      POSTGRES_DB: agrocontrol
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - agrocontrol_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agrocontrol"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: agrocontrol-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: agrocontrol
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: troque-este-segredo-em-producao-com-no-minimo-32-bytes
      JWT_EXPIRATION_MS: 3600000
      CORS_ALLOWED_ORIGINS: http://localhost:4200
    ports:
      - "8080:8080"

volumes:
  agrocontrol_pgdata:
